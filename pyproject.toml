# SPDX-License-Identifier: MIT
[project]
name = "awam-knowledge"
version = "0.1.0"
description = "本地 Markdown 知识库脱敏 / 召回 / 评测 / MCP（Python 版，移植自 Node；脱敏管道来自 knowledge-desensitization 融合）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  # M1：bm25 内核零外部依赖（仅 stdlib）。http 服务亦仅 stdlib（http.server）。
]

[project.scripts]
awam-knowledge = "awam_knowledge.http_service:main"
awam-knowledge-mcp = "awam_knowledge.mcp_server:main"
# M3：脱敏管道统一入口（选择+分发：新增源 → wizard；处理源 → km_pipeline）
awam-knowledge-entry = "awam_knowledge.entry:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# M3：内置基线配置模板（rules.json / *.example.json）随包分发
[tool.setuptools.package-data]
awam_knowledge = ["config/*.json"]
